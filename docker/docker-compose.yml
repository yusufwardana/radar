services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports: ["5432:5432"]
    volumes: [radar-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  browser-worker:
    build:
      context: ../workers/browser
    environment:
      PORT: 3001
    ports: ["3001:3001"]
volumes:
  radar-postgres: